<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Comic Book Day &mdash; July 30, 2026</title>
<style>

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #1a1a2e; color: #e0e0e0; font-family: 'Segoe UI', Arial, sans-serif; line-height: 1.6; }
a { color: #f0a500; text-decoration: none; }
a:hover { text-decoration: underline; }
.page-wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }

/* Header */
header { text-align: center; padding: 40px 20px 28px; border-bottom: 3px solid #f0a500; margin-bottom: 32px; }
header h1 { font-size: 2.2rem; color: #f0a500; letter-spacing: 1px; }

/* Section headings */
.section { margin: 36px 0 20px; }
.section h2 { font-size: 1.5rem; color: #f0a500; border-left: 5px solid #f0a500; padding-left: 14px; margin-bottom: 16px; }

/* Comic card */
.card { background: #16213e; border: 1px solid #2a2a4a; border-radius: 8px; padding: 16px; margin-bottom: 16px; overflow: hidden; }
.card::after { content: ""; display: table; clear: both; }
.card img { float: left; width: 120px; height: auto; margin: 0 16px 8px 0; border-radius: 4px; border: 1px solid #2a2a4a; }
.card-body { overflow: hidden; }
.card h3 { font-size: 1.05rem; color: #ffffff; margin-bottom: 4px; }
.card .meta { font-size: 0.82rem; color: #aaa; margin-bottom: 8px; }
.card .description { font-size: 0.9rem; color: #d0d0d0; margin-bottom: 10px; }
.badges { margin-bottom: 8px; }
.badge { display: inline-block; font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; margin-right: 4px; margin-bottom: 4px; font-weight: 600; }
.badge-first-app { background: #c0392b; color: #fff; }
.badge-first-issue { background: #27ae60; color: #fff; }
.badge-key { background: #d4a017; color: #111; }
.badge-spec { background: #e67e22; color: #fff; }
.buy-btn { display: inline-block; background: #f0a500; color: #111; font-weight: 700; padding: 6px 16px; border-radius: 6px; font-size: 0.85rem; margin-top: 4px; }
.buy-btn:hover { background: #ffbe33; text-decoration: none; }

/* Publisher banner */
.pub-banner { background: #0f3460; color: #fff; padding: 10px 18px; border-radius: 6px; margin: 28px 0 14px; }
.pub-banner h2 { font-size: 1.2rem; letter-spacing: 2px; border: none; padding-left: 0; }

/* Where to buy */
.store-links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
.store-link { background: #16213e; border: 1px solid #f0a500; color: #f0a500; padding: 8px 18px; border-radius: 6px; font-size: 0.9rem; font-weight: 600; }

/* Footer */
footer { text-align: center; padding: 32px 16px 16px; color: #666; font-size: 0.8rem; border-top: 1px solid #2a2a4a; margin-top: 40px; }

</style>
</head>
<body>
<div class="page-wrap">

<header>

  <a class="store-link" href="https://www.keycollectorcomics.com" target="_blank">Key Collector App</a>
</div>
</div>

<footer>

</footer>

</div>
</body>
</html>
